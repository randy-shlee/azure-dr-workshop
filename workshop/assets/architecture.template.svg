<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1580" viewBox="0 0 1600 1580" role="img" aria-labelledby="title description">
  <title id="title">Azure DR workshop: deployed Korea Central / Korea South architecture</title>
  <desc id="description">Verified v1.0.7 baseline. Priority DNS, two private AKS clusters, one RA-GRS account, PostgreSQL primary and geo-replica, metadata-only Event Hubs, active-geo Redis, independent Search, one private ACR, regional DNS and 17 private endpoints. DR role transitions have not been executed.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #18324b; }
      .title { font-size: 30px; font-weight: 700; }
      .region { font-size: 25px; font-weight: 700; }
      .heading { font-size: 20px; font-weight: 650; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #465e73; }
      .label { font-size: 13px; font-weight: 650; text-anchor: middle; }
      .card { fill: white; stroke: #c9d6e3; stroke-width: 1.5; }
      .flow { fill: none; stroke: #0078d4; stroke-width: 2.5; marker-end: url(#arrow); }
      .dns { fill: none; stroke: #0078d4; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .replication { fill: none; stroke: #16846b; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="1580" fill="#f3f6fb"/>
  <text x="40" y="49" class="title">Azure DR workshop | Korea Central + Korea South</text>
  <text x="40" y="78" class="body">Verified deployed baseline: drws1028c / v1.0.7 / 2026-10-28. Deployment and data checks passed; DR transitions not yet executed.</text>

  <rect x="40" y="105" width="340" height="135" rx="14" class="card"/>
  <text x="62" y="138" class="heading">Approved operator / browser</text>
  <text x="62" y="168" class="body">Local package: one deployment command</text>
  <text x="62" y="195" class="small">ARM control plane + approved client CIDR</text>
  <text x="62" y="219" class="small">No public release or local Docker Desktop</text>
  <path d="M380 170 H418" class="dns"/>
  <rect x="420" y="105" width="760" height="135" rx="14" fill="#eaf3ff" stroke="#92b9e8"/>
