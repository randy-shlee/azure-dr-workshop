  <text x="160" y="795" class="body">General Purpose | stable writer / reader aliases</text>
  <text x="980" y="769" class="heading">PostgreSQL | GeoAsyncReplica</text>
  <text x="980" y="795" class="body">Read-only replica | planned switchover / switchback</text>
  <path d="M710 775 H890" class="replication"/>
