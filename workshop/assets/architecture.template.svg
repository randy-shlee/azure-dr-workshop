  <text x="160" y="1139" class="heading">Azure Container Registry | one private registry</text>
  <text x="160" y="1165" class="body">Exact same package image in both AKS clusters | kubelet AcrPull</text>
  <rect x="900" y="1110" width="620" height="72" rx="10" class="card"/>
  <text x="920" y="1139" class="heading">KRS pulls the KRC registry through Private Link</text>
  <text x="920" y="1165" class="body">No second registry / no ACR geo-replication in this baseline</text>
  <rect x="80" y="1200" width="620" height="72" rx="10" class="card"/>
  <image href="__ICON_log-analytics__" x="97" y="1213" width="45" height="45"/>
  <text x="160" y="1229" class="heading">Log Analytics workspace + Azure Monitor PLS</text>
  <text x="160" y="1255" class="body">Deployed in KRC RG | monitor PE in both VNets</text>
  <rect x="900" y="1200" width="620" height="72" rx="10" class="card"/>
  <text x="920" y="1229" class="heading">Regional Private DNS and managed identities</text>
  <text x="920" y="1255" class="body">Shared sample identity trusts both AKS OIDC issuers</text>

  <rect x="40" y="1335" width="1520" height="100" rx="14" fill="#e7f2ef" stroke="#8cbcac"/>
  <text x="62" y="1367" class="heading">One-command local deployment - no public release dependency</text>
  <text x="62" y="1395" class="body">SHA verification - infrastructure - temporary mTLS builder - private image push - both apps - CLI 10 GB samples - replication / reads - smoke</text>
  <text x="62" y="1419" class="small">Temporary builder, port 2376 rule, added push grant and certificates are REMOVED after transfer. No cloud Automation in this deployed path.</text>
  <rect x="40" y="1450" width="1520" height="87" rx="14" fill="#fff3df" stroke="#d7b678"/>
  <text x="62" y="1481" class="heading">Planned DR is a separate approved exercise - NOT part of deployment validation</text>
  <text x="62" y="1508" class="body">To KRS: Storage - EH - PG - TM. Back to KRC app: Storage - PG - EH active check - TM. EH stays in KRS; no former-primary failback.</text>
  <text x="40" y="1564" class="small">Official Microsoft Azure icons (V24), used unchanged for architecture/training. Logical diagram; see architecture.md for scope, resource inventory and safety gates.</text>
