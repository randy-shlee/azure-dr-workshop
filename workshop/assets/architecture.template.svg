  <text x="522" y="169" class="heading">Azure Traffic Manager | Priority</text>
  <text x="522" y="196" class="body">KRC priority 1 / KRS priority 2 | both Enabled + Online</text>
  <text x="522" y="220" class="small">DNS guidance only. The browser sends HTTP directly to the regional public IP.</text>
  <rect x="1220" y="105" width="340" height="135" rx="14" class="card"/>
  <text x="1242" y="138" class="heading">Network boundary</text>
  <text x="1242" y="168" class="body">App HTTP 80: approved IPs + TM probe</text>
  <text x="1242" y="195" class="small">PaaS / ACR data paths remain private</text>
  <text x="1242" y="219" class="small">Not a 99:1 active-active routing design</text>
