  <text x="160" y="705" class="body">Primary: read / write | 10 GB sample payload cap</text>
  <text x="980" y="679" class="heading">Same account | paired regional replica</text>
  <text x="980" y="705" class="body">Read-only secondary | NOT a second Storage account</text>
